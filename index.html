<script>
    // Daten der Schriftzeichen
    const charData = {
        '经': { py: 'jīng', de: 'durchgehen / passieren' },
        '练': { py: 'liàn', de: 'üben / trainieren' },
        '礼': { py: 'lǐ', de: 'Brauch / Höflichkeit' },
        '祝': { py: 'zhù', de: 'wünschen / segnen' },
        '第': { py: 'dì', de: 'Präfix für Ordnungszahlen' },
        '筷': { py: 'kuài', de: 'Essstäbchen' },
        '笑': { py: 'xiào', de: 'lachen / lächeln' },
        '篮': { py: 'lán', de: 'Korb' },
        '笔': { py: 'bǐ', de: 'Stift / Pinsel' },
        '多': { py: 'duō', de: 'viele / viel / mehr als' },
        '岁': { py: 'suì', de: 'Jahre (Alter)' },
        '名': { py: 'míng', de: 'Name / Rang' }
    };

    // Vokabeldaten der Lektion
    const vocabData = [
        { cn: "体育馆", py: "tīyùguǎn", de: "Turnhalle / Fitnessstudio" },
        { cn: "网球", py: "wǎngqiú", de: "Tennis" },
        { cn: "比分", py: "bǐfēn", de: "Punktestand / Ergebnis" },
        { cn: "赢", py: "yíng", de: "gewinnen" },
        { cn: "开始", py: "kāishǐ", de: "beginnen / anfangen" },
        { cn: "第一名", py: "dì-yī-míng", de: "1. Platz / Erster" },
        { cn: "祝贺", py: "zhùhè", de: "gratulieren" },
        { cn: "准备", py: "zhǔnbèi", de: "vorbereiten" },
        { cn: "马拉松", py: "mǎlāsōng", de: "Marathon" },
        { cn: "消息", py: "xiāoxi", de: "Nachricht / Information" }
    ];

    // iOS-Fix: Sprachausgabe für ältere iPhones optimiert
    function speak(text) {
        if (!('speechSynthesis' in window)) {
            alert("Dein Browser unterstützt leider keine Sprachausgabe.");
            return;
        }

        window.speechSynthesis.cancel(); // Stoppt vorherige Wiedergaben

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.7; // Etwas langsamer für deutliche Aussprache

        // Versuche gezielt eine chinesische Stimme auf iOS zu finden
        const voices = window.speechSynthesis.getVoices();
        const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('CN') || v.name.includes('Ting-Ting'));
        
        if (zhVoice) {
            utterance.voice = zhVoice;
        }

        // iOS 'Audio-Unmute' Trick
        window.speechSynthesis.speak(utterance);
    }

    // Stimmen auf iOS vorladen
    if (typeof speechSynthesis !== 'undefined') {
        speechSynthesis.onvoiceschanged = function() {
            speechSynthesis.getVoices();
        };
    }

    // Schreibtrainer Funktionen
    let writer;
    let currentChar = '经';

    function initWriter(char) {
        document.getElementById('grid-background-target').innerHTML = '';
        writer = HanziWriter.create('grid-background-target', char, {
            width: 200, height: 200, padding: 10, showOutline: true,
            strokeAnimationSpeed: 1, delayBetweenStrokes: 150,
            strokeColor: '#c0392b', outlineColor: '#ddd'
        });

        document.getElementById('info-char').innerText = char;
        document.getElementById('info-pinyin').innerText = charData[char].py;
        document.getElementById('info-german').innerText = charData[char].de;
    }

    function selectChar(char, btn) {
        currentChar = char;
        document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        initWriter(char);
        speak(char);
    }

    function speakCurrentChar() {
        speak(currentChar);
    }

    function animateChar() { if (writer) writer.animateCharacter(); }
    function quizChar() { if (writer) writer.quiz(); }

    // Vokabel-Grid rendern
    function renderVocabGrid() {
        const grid = document.getElementById('vocab-grid');
        grid.innerHTML = '';
        vocabData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = (e) => {
                if(!e.target.classList.contains('audio-btn')) {
                    card.classList.toggle('active');
                }
            };
            card.innerHTML = `
                <div class="chinese">
                    ${item.cn} 
                    <button class="audio-btn" onclick="speak('${item.cn}')">🔊</button>
                </div>
                <div class="pinyin">${item.py}</div>
                <div class="german">${item.de}</div>
            `;
            grid.appendChild(card);
        });
    }

    // Zuordnungs-Spiel
    let selectedCn = null;
    let selectedDe = null;

    function initMatchingGame() {
        const cnCol = document.getElementById('cn-column');
        const deCol = document.getElementById('de-column');
        cnCol.innerHTML = '';
        deCol.innerHTML = '';

        const subset = [...vocabData].sort(() => 0.5 - Math.random()).slice(0, 5);
        const shuffCn = [...subset].sort(() => 0.5 - Math.random());
        const shuffDe = [...subset].sort(() => 0.5 - Math.random());

        shuffCn.forEach(item => {
            const div = document.createElement('div');
            div.className = 'match-item';
            div.innerText = item.cn;
            div.dataset.id = item.cn;
            div.onclick = () => selectMatchItem(div, 'cn');
            cnCol.appendChild(div);
        });

        shuffDe.forEach(item => {
            const div = document.createElement('div');
            div.className = 'match-item';
            div.innerText = item.de;
            div.dataset.id = item.cn;
            div.onclick = () => selectMatchItem(div, 'de');
            deCol.appendChild(div);
        });
    }

    function selectMatchItem(el, type) {
        if(el.classList.contains('matched')) return;

        if (type === 'cn') {
            document.querySelectorAll('#cn-column .match-item').forEach(i => i.classList.remove('selected'));
            selectedCn = el;
        } else {
            document.querySelectorAll('#de-column .match-item').forEach(i => i.classList.remove('selected'));
            selectedDe = el;
        }
        el.classList.add('selected');

        if (selectedCn && selectedDe) {
            if (selectedCn.dataset.id === selectedDe.dataset.id) {
                selectedCn.className = 'match-item matched';
                selectedDe.className = 'match-item matched';
                speak(selectedCn.innerText);
            } else {
                selectedCn.classList.remove('selected');
                selectedDe.classList.remove('selected');
            }
            selectedCn = null;
            selectedDe = null;
        }
    }

    // Tipp-Übung
    let currentTypeIndex = 0;

    function loadTypingQuestion() {
        const item = vocabData[currentTypeIndex];
        document.getElementById('type-prompt').innerText = item.de;
        document.getElementById('type-input').value = '';
        document.getElementById('type-feedback').innerText = '';
    }

    function checkTyping() {
        const input = document.getElementById('type-input').value.trim().toLowerCase();
        const item = vocabData[currentTypeIndex];
        const feedback = document.getElementById('type-feedback');

        const cleanPy = item.py.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/-/g, "");

        if (input === item.cn || input === cleanPy || input === item.py.toLowerCase()) {
            feedback.style.color = 'var(--success)';
            feedback.innerText = '✅ Richtig! Gut gemacht!';
            speak(item.cn);
        } else {
            feedback.style.color = 'var(--primary)';
            feedback.innerText = `❌ Noch nicht ganz. Richtig ist: ${item.cn} (${item.py})`;
        }
    }

    function nextTyping() {
        currentTypeIndex = (currentTypeIndex + 1) % vocabData.length;
        loadTypingQuestion();
    }

    // Initiale Lade-Funktionen
    window.onload = function() {
        renderVocabGrid();
        initMatchingGame();
        loadTypingQuestion();
        initWriter(currentChar);
    };
</script>
